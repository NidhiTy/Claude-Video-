name: Network smoke test

# The Tests workflow is fully offline. yt-dlp and ffmpeg change on their own
# schedule, so once a week run the real download -> frames pipeline against one
# stable public file with the newest yt-dlp (keyframe pass and scene-detect pass).
# A failure opens (or comments on) one tracking issue; the next green run closes it.
# Never part of a PR check: an outage must not block unrelated work.
#
# Deliberately not YouTube: YouTube answers GitHub-hosted runner IPs with
# "Sign in to confirm you're not a bot" on every player client, so a YouTube
# job could only ever fail. The YouTube-specific paths (captions, client
# fallbacks) stay covered by the offline suite.

on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  # Popeye for President (1956, public domain) from the Internet Archive, 512kb
  # transcode, ~26 MB. Only the first 30 s are processed. (Wikimedia Commons
  # was tried first and answers yt-dlp's default user agent with 403.)
  VIDEO: https://archive.org/download/Popeye_forPresident/Popeye_forPresident_512kb.mp4

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and the newest yt-dlp
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install -q -U yt-dlp
          yt-dlp --version
          ffmpeg -version | head -1

      - name: Keyframe pass (efficient)
        id: keyframes
        run: |
          set -o pipefail
          python skills/watch/scripts/watch.py "$VIDEO" --detail efficient --no-whisper \
            --start 0 --end 30 --out-dir "$RUNNER_TEMP/k" 2> keyframes.err | tee keyframes.md
          test "$(find "$RUNNER_TEMP/k/frames" -name '*.jpg' | wc -l)" -gt 0
          grep -Eq '\*\*Frames:\*\* [1-9][0-9]* selected' keyframes.md

      - name: Scene-detect pass (balanced)
        id: scenes
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python skills/watch/scripts/watch.py "$VIDEO" --detail balanced --no-whisper \
            --start 0 --end 30 --out-dir "$RUNNER_TEMP/s" 2> scenes.err | tee scenes.md
          test "$(find "$RUNNER_TEMP/s/frames" -name '*.jpg' | wc -l)" -gt 0
          grep -Eq '\*\*Frames:\*\* [1-9][0-9]* selected' scenes.md

      - name: Report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          K: ${{ steps.keyframes.outcome }}
          S: ${{ steps.scenes.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --label smoke-test --state open --json number --jq '.[0].number // empty')
          if [ "$K" = success ] && [ "$S" = success ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Smoke test green again: $RUN"
            fi
            exit 0
          fi
          {
            echo "Weekly network smoke test failed — $RUN"
            echo
            echo "- keyframe pass: **$K**"
            echo "- scene-detect pass: **$S**"
            echo "- yt-dlp: \`$(yt-dlp --version)\`"
            echo
            for f in keyframes.err scenes.err; do
              [ -s "$f" ] || continue
              echo "<details><summary>$f (last 40 lines)</summary>"; echo; echo '```'
              tail -n 40 "$f"
              echo '```'; echo "</details>"; echo
            done
            echo "A new yt-dlp or ffmpeg release, or the source host changing, usually explains this. Closes itself when a run passes."
          } > body.md
          gh label create smoke-test --description "Weekly network smoke test failing" --color d93f0b --force >/dev/null
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "Network smoke test failing" --label smoke-test --body-file body.md
          fi
          exit 1
